# config.yaml — drivecheck configuration

collector:
  scan_interval: 300  # seconds — drive discovery (scan + reconciliation)
  keep_history_days: 90  # days — retention window for time-series tables (drive_signals,
                          # drive_heartbeats, drive_vitals, drive_raw_snapshots)
  max_workers: 4      # thread pool size for per-drive channel polling
  probe_timeout: 30   # seconds — subprocess timeout for smartctl calls
  poll_intervals:
    telemetry: 300    # seconds — signals + heartbeat
    snapshot: 14400   # seconds — raw smartctl JSON persistence
    vitals: 10        # seconds — cheap temp + disk IO activity
    traits: 86400     # seconds — re-run traits probes for already-known drives

  # Probe chains, run in order. Each stage's results are merged/concatenated —
  # see Probe System in CLAUDE.md.
  scan_probes:
    - drives.collector.probes.scan.smartctl_scan
  traits_probes:
    - drives.collector.probes.traits.smartctl_traits
  telemetry_probes:
    - drives.collector.probes.telemetry.smartctl_telemetry
  vitals_probes:
    - drives.collector.probes.vitals.hwmon_temp
    - drives.collector.probes.vitals.smartctl_vitals
    - drives.collector.probes.vitals.sysfs_io
    - drives.collector.probes.vitals.mount_status
  custom_probes_dir: custom_probes
  # true lets the Settings UI create, upload, edit and delete custom probes.
  # Probes are Python the backend runs, so leave this off unless you're writing
  # probes. Only settable here (not from the UI); restart after changing it.
  allow_probe_editing: false
jobs:
  # Cap on simultaneously-running jobs across all drives. Each drive already
  # runs one job at a time, so `null` (no limit) lets every drive be tested at
  # once. Set a number when drives share bandwidth (one controller, expander or
  # USB hub) or running them all at once heats the enclosure. Restart to apply.
  max_parallel: null
  enable_debug_operations: true   # adds "Sleep (debug)" for exercising the
                                   # queue/scheduler without touching drives

logging:
  level: info                    # debug | info | warning | error
  file: data/drivecheck.log      # path to log file, or null to disable

data:
  dir: ./data

server:
  host: 127.0.0.1
  port: 4343
  debug: false
  https: true        # false only behind a reverse proxy that handles HTTPS
  tls_cert:          # PEM files; empty = self-signed cert in <data dir>/tls/
  tls_key:
  tls_extra_names:   # more hostnames/IPs for the self-signed cert
    - 75.100.43.250
